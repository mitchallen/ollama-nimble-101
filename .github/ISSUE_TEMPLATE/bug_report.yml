name: Bug report
description: Something in the client, examples or Makefile doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command(s), e.g. `make routing`.
      placeholder: |
        1. make setup
        2. make routing
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Full command output or traceback.
      render: shell
  - type: input
    id: ollama
    attributes:
      label: Ollama version
      description: Output of `ollama --version` (Nimble needs 0.35 or later).
  - type: input
    id: env
    attributes:
      label: OS and uv version
      placeholder: macOS 26, uv 0.11.26
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: "`make check` passes (Ollama is running and `nimble` is pulled)"
