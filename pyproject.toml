[project]
name = "ollama-nimble-101"
version = "0.1.0"
description = "Examples for Ollama's Nimble decision model (/v1/systemone)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nimble101"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Ollama server with nimble pulled"]
addopts = "-m 'not integration'"
